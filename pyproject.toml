[project]
name = "mcp-langgraph-app"
version = "0.1.0"
description = "LangGraph application with 2 MCP servers and 1 client"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.2.7",
    "langchain-groq>=1.1.1",
    "langgraph>=1.0.6",
    "mcp>=1.25.0",
    "python-dotenv>=1.2.1",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.13",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
